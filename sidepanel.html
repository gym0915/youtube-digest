<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sidepanel.pageTitle"></title>
    <link rel="stylesheet" href="segmented-control.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "YouTube Digest" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <button
          class="settings-btn"
          id="settingsBtn"
          type="button"
          data-i18n-title="sidepanel.openSettings"
          data-i18n-aria-label="sidepanel.openSettings"
        >
          <svg class="lucide lucide-settings" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <!-- Tab navigation -->
      <div
        class="tabs"
        id="tabsNav"
        role="tablist"
        data-i18n-aria-label="sidepanel.tabsLabel"
        style="display: none"
      >
        <button
          class="tab active"
          data-tab="transcript"
          id="tabTranscript"
          type="button"
          role="tab"
          aria-controls="panelTranscript"
          aria-selected="true"
          tabindex="0"
        data-i18n="sidepanel.tabTranscript"
        ></button>
        <button
          class="tab"
          data-tab="overview"
          id="tabOverview"
          type="button"
          role="tab"
          aria-controls="panelOverview"
          aria-selected="false"
          tabindex="-1"
        data-i18n="sidepanel.tabOverview"
        ></button>
        <button
          class="tab"
          data-tab="notes"
          id="tabNotes"
          type="button"
          role="tab"
          aria-controls="panelNotes"
          aria-selected="false"
          tabindex="-1"
        data-i18n="sidepanel.tabNotes"
        ></button>
      </div>

      <!-- Transcript controls live in the fixed header so they remain visibly
           connected to the active Transcript tab while the transcript scrolls. -->
      <div
        class="transcript-toolbar"
        id="transcriptToolbar"
        data-i18n-aria-label="sidepanel.transcriptControls"
        hidden
      >
        <div
          class="transcript-mode-control"
          id="transcriptModeControl"
          role="group"
          data-i18n-aria-label="sidepanel.transcriptLanguage"
        >
          <button
            class="transcript-mode-btn active"
            type="button"
            data-transcript-mode="original"
            aria-pressed="true"
          data-i18n="transcript.modeOriginal"
          ></button>
          <button
            class="transcript-mode-btn"
            type="button"
            data-transcript-mode="zh"
            aria-pressed="false"
          data-i18n="transcript.modeChinese"
          ></button>
          <button
            class="transcript-mode-btn"
            type="button"
            data-transcript-mode="bilingual"
            aria-pressed="false"
          data-i18n="transcript.modeBilingual"
          ></button>
          <span
            class="translation-spinner"
            id="langSpinner"
            role="status"
            aria-live="polite"
            data-i18n-aria-label="sidepanel.translationInProgress"
          ></span>
        </div>
        <div class="transcript-actions">
          <button
            class="transcript-action-btn"
            id="copyTranscriptBtn"
            type="button"
            data-i18n-title="sidepanel.copyTranscript"
            data-i18n-aria-label="sidepanel.copyTranscript"
          >
            <svg class="lucide lucide-copy" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
          </button>
          <button
            class="transcript-action-btn"
            id="exportTranscriptBtn"
            type="button"
            data-i18n-title="sidepanel.exportTranscript"
            data-i18n-aria-label="sidepanel.exportTranscript"
          >
            <svg class="lucide lucide-download" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon">&#9655;</div>
        <div class="welcome-title" data-i18n="sidepanel.welcomeTitle"></div>
        <div class="welcome-desc" data-i18n="sidepanel.welcomeDescription"></div>
      </div>

      <!-- LOADING STATE -->
      <div
        id="loadingState"
        class="status-message status-message--loading"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        style="display: none"
      >
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText" data-i18n="sidepanel.loadingTranscript"></div>
          <div class="loading-subtext" id="loadingSubtext" data-i18n="sidepanel.loadingCaptions"></div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div
        id="errorState"
        role="alert"
        class="status-message status-message--error"
        style="display: none"
      >
        <div class="error-container">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle" data-i18n="sidepanel.errorTitle"></div>
          <div class="error-message" id="errorMessage" data-i18n="sidepanel.errorMessage"></div>
          <button class="error-btn" id="errorBtn" data-i18n="sidepanel.retry"></button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div
          class="tab-panel active"
          data-panel="transcript"
          id="panelTranscript"
          role="tabpanel"
          aria-labelledby="tabTranscript"
          aria-hidden="false"
        >
          <div class="section">
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div
          class="tab-panel"
          data-panel="overview"
          id="panelOverview"
          role="tabpanel"
          aria-labelledby="tabOverview"
          aria-hidden="true"
          data-overview-state="idle"
        >
          <div
            class="overview-status overview-status--idle"
            id="overviewStatus"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          >
            <span class="overview-status-icon" aria-hidden="true">○</span>
            <div>
              <strong id="overviewStatusTitle" data-i18n="overview.readyTitle"></strong>
              <p id="overviewStatusMessage" data-i18n="overview.readyMessage"></p>
            </div>
          </div>
          <!-- Chapters -->
          <div class="section">
            <div class="overview-section-heading">
              <div class="section-title" data-i18n="overview.chapters"></div>
              <span
                class="overview-loading-spinner"
                id="chaptersLoadingIndicator"
                role="status"
                aria-live="polite"
                data-i18n-aria-label="overview.loadingChapters"
                hidden
              ></span>
            </div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                <span data-i18n="overview.chaptersPlaceholder"></span>
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="overview-section-heading">
              <div class="section-title" data-i18n="overview.keyQuotes"></div>
              <span
                class="overview-loading-spinner"
                id="quotesLoadingIndicator"
                role="status"
                aria-live="polite"
                data-i18n-aria-label="overview.loadingQuotes"
                hidden
              ></span>
            </div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  <span data-i18n="overview.quotesPlaceholder"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div
          class="tab-panel"
          data-panel="notes"
          id="panelNotes"
          role="tabpanel"
          aria-labelledby="tabNotes"
          aria-hidden="true"
        >
          <div class="section">
            <div class="section-header">
              <div class="section-title" data-i18n="notes.savedTitle"></div>
              <div
                class="segmented-control notes-filter"
                role="group"
                data-i18n-aria-label="notes.filterLabel"
                data-segmented-control
              >
                <button
                  class="segmented-control__option"
                  id="notesFilterThis"
                  type="button"
                  aria-pressed="true"
                  data-segmented-value="this-video"
                >
                  <span data-i18n="notes.thisVideo"></span>
                </button>
                <button
                  class="segmented-control__option"
                  id="notesFilterAll"
                  type="button"
                  aria-pressed="false"
                  data-segmented-value="all-notes"
                >
                  <span data-i18n="notes.all"></span>
                </button>
              </div>
            </div>
            <p
              class="notes-intro"
              id="notesIntro"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              <span data-i18n="notes.introBefore"></span>
              <svg
                class="lucide lucide-notebook-pen notes-intro-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M2 6h4" />
                <path d="M2 10h4" />
                <path d="M2 14h4" />
                <path d="M2 18h4" />
                <rect width="16" height="20" x="4" y="2" rx="2" />
                <path d="M15.5 7.5 18 10" />
                <path d="M14 14.5 12 17l2.5-2" />
                <path d="m18.5 7.5-4.1 4.1a2.12 2.12 0 0 0-.5.8l-.7 2.2 2.2-.7a2.12 2.12 0 0 0 .8-.5l4.1-4.1a1.5 1.5 0 0 0-2.1-2.1Z" />
              </svg>
              <span data-i18n="notes.introAfter"></span>
            </p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      type="button"
      data-i18n-aria-label="follow.resume"
      data-i18n-title="follow.resume"
      style="display: none"
    >
      <svg class="lucide lucide-locate-fixed" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="1" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>
    <p
      class="follow-playback-status"
      id="followPlaybackStatus"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

    <script src="i18n.js"></script>
    <script src="settings.js"></script>
    <script src="segmented-control.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
